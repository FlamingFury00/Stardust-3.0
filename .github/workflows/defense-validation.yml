name: Defense replay validation
on:
  pull_request:
    branches: [beta]
  push:
    branches: [beta]
permissions:
  contents: read
concurrency:
  group: defense-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  defense:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Archive the exact source under test
        run: |
          mkdir -p validation-artifacts
          git rev-parse HEAD > validation-artifacts/commit.txt
          git archive --format=tar.gz --output=validation-artifacts/source.tar.gz HEAD
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Prepare schema generator
        run: chmod +x src/generate-flatbuffers.sh src/flatbuffers-schema/binaries/flatc
      - name: Build and validate team defense
        run: dotnet run --project tests/Stardust.TeamDefense/Stardust.TeamDefense.csproj --configuration Release
      - name: Retain isolated offline validation toolchain
        if: github.head_ref == 'fix/predictive-goal-side-defense'
        shell: bash
        run: |
          set -euo pipefail
          root="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          version="$(find "$root/sdk" -mindepth 1 -maxdepth 1 -type d -name '8.*' -printf '%f\n' | sort -V | tail -1)"
          test -n "$version"
          cd "$root"
          shopt -s nullglob
          paths=(dotnet sdk/"$version" host/fxr/8.* shared/Microsoft.NETCore.App/8.* packs/Microsoft.NETCore.App.Ref/8.* packs/Microsoft.AspNetCore.App.Ref/8.* packs/NETStandard.Library.Ref packs/Microsoft.NETCore.App.Host.linux-x64/8.*)
          tar -czf "$GITHUB_WORKSPACE/validation-artifacts/dotnet.tar.gz" "${paths[@]}"
          tar -C "$HOME/.nuget" -czf "$GITHUB_WORKSPACE/validation-artifacts/nuget-packages.tar.gz" packages
      - uses: actions/upload-artifact@v7
        with:
          name: defense-source-${{ github.run_id }}
          path: validation-artifacts/
          retention-days: 1
          if-no-files-found: error
