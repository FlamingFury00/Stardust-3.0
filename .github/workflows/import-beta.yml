name: Import Stardust 3.0 beta

on:
  push:
    branches: [beta]

permissions:
  contents: write

jobs:
  import:
    if: github.event.head_commit.message != 'Import Stardust 3.0 beta tree'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target beta branch
        uses: actions/checkout@v4
        with:
          ref: beta
          path: target
          fetch-depth: 1

      - name: Checkout prepared Stardust 3.0 export
        uses: actions/checkout@v4
        with:
          repository: FlamingFury00/Stardust-2.0
          ref: export/stardust-3.0-beta
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Replace target tree with prepared beta tree
        run: |
          rsync -a --delete --exclude='.git/' source/ target/
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Stardust 3.0 beta tree"
          git push origin HEAD:beta
