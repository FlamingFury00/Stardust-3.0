name: Stardust control regression
on:
  push:
    branches: [beta]
  pull_request:
    branches: [beta]
permissions:
  contents: read
concurrency:
  group: stardust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Make schema generator executable
        run: chmod +x src/generate-flatbuffers.sh src/flatbuffers-schema/binaries/flatc
      - name: Build bot
        run: dotnet build src/Bot/Bot.csproj --configuration Release
      - name: Run deterministic regressions
        run: dotnet run --project tests/Stardust.Tests/Stardust.Tests.csproj --configuration Release
      - name: Run analytic attitude and route checks
        run: dotnet run --project tests/Stardust.ModelChecks/Stardust.ModelChecks.csproj --configuration Release
      - name: Run movement and recovery regressions
        run: dotnet run --project tests/Stardust.Movement/Stardust.Movement.csproj --configuration Release
      - name: Run shooting and contact regressions
        run: dotnet run --project tests/Stardust.Shooting/Stardust.Shooting.csproj --configuration Release
      - name: Run aerial thrust regressions
        run: dotnet run --project tests/Stardust.AerialControl/Stardust.AerialControl.csproj --configuration Release
      - name: Run jump-edge regressions
        run: dotnet run --project tests/Stardust.JumpEdges/Stardust.JumpEdges.csproj --configuration Release
      - name: Run timed-shot jump-edge regressions
        run: dotnet run --project tests/Stardust.ShotJumpEdges/Stardust.ShotJumpEdges.csproj --configuration Release
      - name: Run team shape and defense regressions
        run: dotnet run --project tests/Stardust.TeamDefense/Stardust.TeamDefense.csproj --configuration Release
      - name: Run boost economy and goal-return regressions
        run: dotnet run --project tests/Stardust.BoostGoal/Stardust.BoostGoal.csproj --configuration Release
      - name: Run possession mechanics physics regressions
        run: dotnet run --project tests/Stardust.MechanicsPhysics/Stardust.MechanicsPhysics.csproj --configuration Release
      - name: Ensure native video validation is available
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Run blinded review and video normalization regressions
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
