name: Verify Stardust version strings

on:
  push:
    branches: [beta]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 1

      - name: Ensure legacy version name is gone
        run: |
          set -euo pipefail
          needle="$(printf 'Stardust %s.%s' '2' '0')"
          if git grep -n -F "$needle" -- . ':(exclude).github/workflows/verify-version.yml'; then
            echo "Legacy version name still exists."
            exit 1
          fi
          echo "No legacy version name remains in tracked files."
