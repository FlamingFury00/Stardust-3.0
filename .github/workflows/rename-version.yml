name: Rename Stardust version strings

on:
  push:
    branches: [beta]

permissions:
  contents: write

jobs:
  rename:
    if: github.event.head_commit.message != 'Rename Stardust 2.0 strings to Stardust 3.0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 1

      - name: Replace exact version name everywhere
        run: |
          set -euo pipefail
          mapfile -t files < <(git grep -Il -F 'Stardust 2.0' -- . ':(exclude).github/workflows/rename-version.yml' || true)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No matches found."
            exit 0
          fi

          printf 'Updating %s\n' "${files[@]}"

          python3 - "${files[@]}" <<'PY'
          import pathlib, sys
          old = "Stardust 2.0"
          new = "Stardust 3.0"
          for name in sys.argv[1:]:
              p = pathlib.Path(name)
              text = p.read_text(encoding="utf-8")
              replaced = text.replace(old, new)
              if replaced != text:
                  p.write_text(replaced, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename Stardust 2.0 strings to Stardust 3.0"
          git push origin HEAD:beta
