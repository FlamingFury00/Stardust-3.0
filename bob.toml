[[config]]
project_name = "Stardust-3.0"
bot_configs = ["./Stardust.bot.toml"]

[config.builder_config]
# The dockerfile publishes a native Linux binary and a self-contained Windows executable; bob finds
# them by file type and writes them into the bot config as its run commands.
builder_type = "custom"
dockerfile = "./dockerfile"
values = { windows_binary = "Bot.exe", linux_binary = "Bot" }
